name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        type: string
      platform:
        description: Platform assets to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows

permissions:
  contents: write

jobs:
  select-platforms:
    name: Select release platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        name: Build platform matrix
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          macos='{"os":"macos-15","platform":"macos","rust_target":"aarch64-apple-darwin","swift_target":"arm64-apple-macos14.4","tauri_args":"--target aarch64-apple-darwin"}'
          windows='{"os":"windows-latest","platform":"windows","tauri_args":""}'
          case "$PLATFORM" in
            macos) matrix="{\"include\":[$macos]}" ;;
            windows) matrix="{\"include\":[$windows]}" ;;
            all) matrix="{\"include\":[$macos,$windows]}" ;;
            *) echo "Unsupported platform: $PLATFORM"; exit 1 ;;
          esac
          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    name: Build & Publish Release (${{ matrix.platform }})
    needs: select-platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 1. Environments Setup ──────────────────────────────────────
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── 2. Install Dependencies ────────────────────────────────────
      - name: Install Audio Dependencies (macOS)
        if: matrix.platform == 'macos'
        run: brew install portaudio

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Validate release version
        shell: bash
        run: npm run release:check-version

      - name: Install Python Dependencies
        if: matrix.platform == 'macos'
        run: |
          python -m pip install --upgrade pip
          pip install -r src-python/requirements.txt -r src-python/requirements-dev.txt pyinstaller

      # ── 3. Compile Standalone Sidecar Binaries ─────────────────────
      - name: Build Python Sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/build-windows-sidecar.ps1 -Python python
          ./scripts/build-windows-sidecar-gpu.ps1 -Python python

      - name: Prepare Windows Engine Release Assets
        if: matrix.platform == 'windows'
        shell: bash
        env:
          ENGINE_RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}
        run: |
          node scripts/split-engine-release-asset.mjs src-tauri/binaries/ai-notetaking-engine-windows-x64-gpu.exe
          npm run engine:manifest

      - name: Build Python Sidecar (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd src-python
          pyinstaller build.spec
          mkdir -p ../src-tauri/binaries
          cp dist/ai-notetaking-engine "../src-tauri/binaries/ai-notetaking-engine-${{ matrix.rust_target }}"

      - name: Build Core Audio Tap (macOS)
        if: matrix.platform == 'macos'
        run: |
          swiftc src-tauri/binaries/audio-tap.swift \
            -o "src-tauri/binaries/audio-tap-${{ matrix.rust_target }}" \
            -framework AudioToolbox \
            -framework AVFoundation \
            -framework Foundation \
            -target "${{ matrix.swift_target }}"

      # ── 4. Tauri Compilation and GitHub Release Upload ─────────────
      - name: Build Tauri Release Bundles
        env:
          AI_NOTETAKING_ENGINE_RELEASE_TAG: ${{ env.RELEASE_TAG }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Create Draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --draft \
              --target "${{ github.sha }}" \
              --title "AI NoteTaking $RELEASE_TAG Preview" \
              --notes "Preview release $RELEASE_TAG. macOS builds use ad-hoc signing and may require manual Gatekeeper approval." \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi

      - name: Upload Tauri Release Bundles
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("${asset}")
          done < <(find src-tauri/target -type f -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.json' \) -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Tauri bundle assets found."
            find src-tauri/target -maxdepth 6 -type f
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Smoke-check packaged artifacts
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            dmg=$(find src-tauri/target -type f -name '*.dmg' -print -quit)
            test -n "$dmg"
            hdiutil verify "$dmg"
          else
            installer=$(find src-tauri/target -type f \( -name '*.msi' -o -name '*-setup.exe' \) -print -quit)
            test -n "$installer"
            test -s "$installer"
          fi

      - name: Upload Windows Engine Variants
        if: matrix.platform == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cpu=src-tauri/binaries/ai-notetaking-engine-windows-x64-cpu.exe
          gpu=src-tauri/binaries/ai-notetaking-engine-windows-x64-gpu.exe
          manifest=src-tauri/binaries/engines-manifest.json
          shopt -s nullglob
          gpu_parts=("${gpu}".part*)
          assets=("${cpu}" "${manifest}")
          if [ "${#gpu_parts[@]}" -gt 0 ]; then
            assets+=("${gpu_parts[@]}")
          else
            assets+=("${gpu}")
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

  finalize:
    name: Publish release
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Publish pre-release
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false --prerelease
