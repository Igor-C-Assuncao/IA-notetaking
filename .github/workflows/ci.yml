name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 1. Environments Setup ──────────────────────────────────────
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # ── 2. Install Dependencies ────────────────────────────────────
      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src-python/requirements.txt -r src-python/requirements-dev.txt

      # ── 3. Static Analysis & Linting ───────────────────────────────
      - name: Lint Python (Ruff)
        run: |
          cd src-python
          ruff check .

      - name: Lint Frontend (TypeScript)
        run: npx tsc --noEmit

      - name: Format Rust (cargo fmt)
        run: |
          cd src-tauri
          cargo fmt --check

      - name: Lint Rust (cargo clippy)
        run: |
          cd src-tauri
          cargo clippy --all-targets -- -D warnings

      # ── 4. Unit & Integration Tests ────────────────────────────────
      - name: Test Frontend (Vitest)
        run: npm run test

      - name: Test Python Services (pytest)
        env:
          IS_TESTING: "1"
        run: |
          pytest src-python/tests/

      - name: Test Rust Backend (cargo test)
        run: |
          cd src-tauri
          cargo test

      # ── 5. Smoke Build (Tauri Debug Build) ──────────────────────────
      - name: Build Smoke Test
        env:
          SIDECAR_CHECK_ALLOW_MISSING: "1"
        run: npm run tauri build -- --debug
