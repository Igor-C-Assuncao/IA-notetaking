[project]
name = "ai-notetaking-engine"
version = "0.3.1"
description = "Python AI engine (sidecar) for AI NoteTaking: audio capture, VAD, transcription, and meeting intelligence"
license = "Apache-2.0"
authors = [{ name = "Igor Cassimiro Assunção" }]

[project.urls]
Repository = "https://github.com/Igor-C-Assuncao/IA-notetaking"

[tool.pytest.ini_options]
testpaths = ["src-python/tests"]
pythonpath = ["src-python"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (skipped by default in regular CI runs)"
]

[tool.ruff.lint]
# Keep CI focused on Python errors that can break a release. The project has
# historical style findings which will be addressed separately rather than
# making unrelated product changes fail the full platform matrix.
select = ["E9", "F"]

[tool.coverage.run]
source = ["src-python"]
omit = [
    "src-python/tests/*",
    "src-python/.venv/*",
    "src-python/__pycache__/*"
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
