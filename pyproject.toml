[tool.pytest.ini_options]
testpaths = ["src-python/tests"]
pythonpath = ["src-python"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (skipped by default in regular CI runs)"
]

[tool.coverage.run]
source = ["src-python"]
omit = [
    "src-python/tests/*",
    "src-python/.venv/*",
    "src-python/__pycache__/*"
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError"
]
